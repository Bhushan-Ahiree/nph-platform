# docker-compose.yml
# Default stack: api + worker + redis + mongo.
# Optional profiles:  --profile llm      -> local Ollama for LLM enrichment (set LLM_ENABLED=true)
#                     --profile scraper  -> HTML scraper demo
services:
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    image: nph-platform:local
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - .env
    working_dir: /app
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_started
      mongo:
        condition: service_healthy
    networks:
      - nph_network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    command: uvicorn apps.api.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir apps/api --reload-dir shared --reload-dir services

  nph_worker:
    image: nph-platform:local
    pull_policy: never
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - .:/app
    working_dir: /app/apps/worker
    # Beat schedule state lives in /tmp so it never lands in the repo
    command: celery -A main.celery_app worker -B --schedule /tmp/celerybeat-schedule --loglevel=info
    depends_on:
      redis:
        condition: service_started
      mongo:
        condition: service_healthy
    networks:
      - nph_network

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - nph_network

  # Single-node replica set: site-visit booking uses multi-document transactions
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - nph_network
    healthcheck:
      # Initiates the replica set on first boot, then reports healthy once it is ready
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo:27017'}]}).ok }"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  ollama:
    image: ollama/ollama:0.5.7
    profiles: ["llm"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - nph_network

  nph_scraper:
    image: nph-platform:local
    pull_policy: never
    profiles: ["scraper"]
    env_file:
      - .env
    volumes:
      - .:/app
    working_dir: /app/apps/scraper
    command: python run.py
    depends_on:
      api:
        condition: service_healthy
    networks:
      - nph_network

volumes:
  redis_data:
  mongo_data:
  ollama_data:

networks:
  nph_network:
    driver: bridge
