# docker-compose.yml
version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    container_name: nph_api
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - .env
    volumes:
      # Mount local code for live-reloading during development
      - ./apps/api:/app/apps/api
      - ./services:/app/services
      - ./shared:/app/shared
    depends_on:
      - redis
    command: uvicorn apps.api.main:app --host 0.0.0.0 --port 8000 --reload

  redis:
    image: redis:7-alpine
    container_name: nph_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  redis_data: