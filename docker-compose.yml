# docker-compose.yml

services:
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    container_name: nph_api
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - .env
    volumes:
      # Mount local code for live-reloading during development
      - ./apps/api:/app/apps/api
      - ./services:/app/services
      - ./shared:/app/shared
    depends_on:
      - redis
    networks:
      - nph_network
    command: uvicorn apps.api.main:app --host 0.0.0.0 --port 8000 --reload

  redis:
    image: redis:7-alpine
    container_name: nph_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - nph_network

  nph_scraper:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    container_name: nph_scraper
    volumes:
      - ./apps/scraper:/app/apps/scraper
      - ./shared:/app/shared
    working_dir: /app/apps/scraper
    command: sh -c "pip install -r requirements.txt && python run.py"
    depends_on:
      - api  # FIXED: Pointing to the structural service key name
    networks:
      - nph_network

volumes:
  redis_data:

networks:
  nph_network:
    driver: bridge