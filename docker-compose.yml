# docker-compose.yml
services:
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    container_name: nph_api
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - .env
    working_dir: /app
    volumes:
      - .:/app 
    depends_on:
      - redis
    networks:
      - nph_network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 180s
    command: sh -c "pip install -r apps/api/requirements.txt && uvicorn apps.api.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir apps/api --reload-dir shared --reload-dir services"

  redis:
    image: redis:7-alpine
    container_name: nph_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - nph_network

  nph_worker:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    container_name: nph_worker
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - PYTHONPATH=/app
    env_file:
      - .env
    volumes:
      - ./apps/worker:/app/apps/worker
      - ./shared:/app/shared
      - ./services:/app/services
    working_dir: /app/apps/worker
    # Command: Install runtime worker requirements and fire up the Celery execution daemon
    command: sh -c "pip install -r requirements.txt && celery -A main.celery_app worker -B --loglevel=info"
    depends_on:
      - redis
    networks:
      - nph_network

  nph_scraper:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    container_name: nph_scraper
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: on-failure
    volumes:
      - ./apps/scraper:/app/apps/scraper
      - ./shared:/app/shared
    working_dir: /app/apps/scraper
    command: sh -c "pip install -r requirements.txt && python run.py"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - nph_network

volumes:
  redis_data:

networks:
  nph_network:
    driver: bridge